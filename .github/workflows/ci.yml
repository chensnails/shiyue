name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: UI 回归测试
        run: npm run test:ui

      # 含 Dockerfile 文件清单校验：防止抽到 lib/ 后忘了 COPY，镜像构建成功但容器启动即崩
      - name: 后端单测 + Dockerfile 清单校验
        run: npm run test:server

      - name: 冒烟：Node 端可加载
        run: node --check server.js
